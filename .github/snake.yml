name: Generate Snake Animation

on:
  # Запускать каждый день в полночь по UTC
  schedule:
    - cron: "0 0 * * *"
  # Позволяет запустить вручную из вкладки Actions
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Важно: дает право на запись в репозиторий
    steps:
      # Генерация SVG-файлов змейки
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      
      # Публикация сгенерированных файлов в ветку 'output'
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
